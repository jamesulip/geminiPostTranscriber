name: CI

on:
  push:
    branches: [feat/transcriber-mvp, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # vue-tsc + vite; also produces ../dist, which generate_context! needs at compile time.
      - name: Typecheck and build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build requires the sidecar to exist; the audio tests run ffmpeg from PATH.
      - name: Fetch ffmpeg sidecar
        run: |
          ./scripts/fetch-ffmpeg.sh x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$PWD/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu" "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
