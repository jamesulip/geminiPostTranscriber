name: Release

# Push a tag like v0.2.0 (matching tauri.conf.json's version), or run manually from the Actions tab.
# Builds land as assets on a draft GitHub release; publish it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # A build with the placeholder key still succeeds, but its installs could never verify an update.
      - name: Check updater public key
        shell: bash
        run: |
          if grep -q PASTE_ src-tauri/tauri.conf.json; then
            echo "::error::Set plugins.updater.pubkey in tauri.conf.json to the contents of ~/.tauri/transcriber.key.pub"
            exit 1
          fi

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Fetch ffmpeg sidecar
        shell: bash
        run: ./scripts/fetch-ffmpeg.sh ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles; tauri-action then uploads latest.json for the in-app updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # sherpa-onnx ships static-MT (static CRT) Windows libs.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: Transcriber v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
